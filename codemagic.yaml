workflows:
  android-release:
    name: Floppy Bird Android release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        - floppy_bird_keystore
    scripts:
      - name: Restore Gradle wrapper binary
        script: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          fi
      - name: Install packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Configure signing
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/key.properties
      - name: Build release artifacts
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
