plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.flappy_bird'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    // Keep Java and Kotlin bytecode targets identical. Flutter's current
    // Android template recommends JDK 17 for AGP 8.x builds.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId 'com.example.flappy_bird'
        // Google Mobile Ads and current Android tooling are supported from API 23.
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
}

kotlin {
    jvmToolchain(17)
}

flutter { source '../..' }
