plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace 'com.arpit.floppybird'
    compileSdk 35
    ndkVersion flutter.ndkVersion
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17.toString() }
    defaultConfig {
        applicationId 'com.arpit.floppybird'
        minSdk 23
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']; keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile']); storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes { release { signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug; minifyEnabled false; shrinkResources false } }
}
flutter { source '../..' }
